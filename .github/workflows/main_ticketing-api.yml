name: Build and deploy GateKeeper API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./src/GateKeeper.Api/GateKeeper.Api.csproj

      - name: Publish Function App
        run: dotnet publish ./src/GateKeeper.Api/GateKeeper.Api.csproj -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FB5BC00EC2214015977432CF4116AD3A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ED3DFE9B77504083BB67B894A6B03F63 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_47024F6AC6A0494C93826EDEF1F976E8 }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ticketing-api
          slot-name: Production
          package: ./publish
