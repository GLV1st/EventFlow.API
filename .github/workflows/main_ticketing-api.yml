
name: Build and deploy GateKeeper API to Azure Functions - ticketing-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish GateKeeper API
        shell: pwsh
        run: |
          dotnet publish ./src/GateKeeper.Api/GateKeeper.Api.csproj `
            --configuration Release `
            --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E7F52040B23C4278BF86FE8AAE2FA996 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_16C5DA70EC7D47C5AD9AB13A48480B5F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_35DFE3C08AD744C5A4112702F44163F1 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'ticketing-api'
          slot-name: 'Production'
          package: './publish'
