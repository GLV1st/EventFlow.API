
name: Build and deploy EventFlow API to Azure Functions - EventFlowAPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish EventFlow API
        shell: pwsh
        run: |
          dotnet publish ./src/EventFlow.Api/EventFlow.Api.csproj `
            --configuration Release `
            --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4431DD7D10284ECB8B819CF7D4FC2518 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3DA450E685294F8F9729A29C90E5D7A8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D2C329E396054FDE96D783AA1A2AB7E4 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'EeventFlowAPI'
          slot-name: 'Production'
          package: './publish'
